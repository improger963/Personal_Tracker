      rel="stylesheet"
    />
    <script>
      (function () {
        // Suppress benign Vite HMR WebSocket connection errors in dev preview environment
        var isBenignViteWsError = function (text) {
          if (!text) return false;
          var s = String(text);
          return (
            s.indexOf('WebSocket closed without opened') !== -1 ||
            s.indexOf('failed to connect to websocket') !== -1 ||
            (s.indexOf('@vite/client') !== -1 && s.indexOf('WebSocket') !== -1)
          );
        };

        var origConsoleError = console.error;
        console.error = function () {
          try {
            var args = Array.prototype.slice.call(arguments);
            var combined = args
              .map(function (a) {
                if (!a) return '';
                if (typeof a === 'string') return a;
                return (a.message || '') + ' ' + (a.stack || '') + ' ' + String(a);
              })
              .join(' ');
            if (
              combined.indexOf('[vite]') !== -1 &&
              isBenignViteWsError(combined)
            ) {
              return;
            }
          } catch (e) {}
          return origConsoleError.apply(console, arguments);
        };

        window.addEventListener(
          'error',
          function (event) {
            var text =
              (event.message || '') +
              ' ' +
              (event.filename || '') +
              ' ' +
              (event.error && (event.error.stack || event.error.message || ''));
            if (isBenignViteWsError(text)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event.reason;
            var msg = reason
              ? (reason.message || '') +
                ' ' +
                (reason.stack || '') +
                ' ' +
                String(reason)
              : '';
            if (isBenignViteWsError(msg)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        try {
          var saved = localStorage.getItem('pa_theme_dark');
          if (saved === 'false') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      #pa-boot-loader {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #F4F6FA;
        color: #0F172A;
        font-family: "Plus Jakarta Sans", "Noto Sans Armenian", -apple-system, BlinkMacSystemFont, sans-serif;
      }
      html.dark #pa-boot-loader {
        background: #080C14;
        color: #F8FAFC;
      }
      .pa-boot-spinner {
        width: 34px;
        height: 34px;
        border-radius: 9999px;
        border: 2.5px solid rgba(37, 99, 235, 0.18);
        border-top-color: #2563EB;
        animation: pa-boot-spin 0.75s linear infinite;
      }
      html.dark .pa-boot-spinner {
        border-color: rgba(96, 165, 250, 0.18);
        border-top-color: #3B82F6;
      }
      .pa-boot-title {
        font-family: "Outfit", "Noto Sans Armenian", sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .pa-boot-sub {
        font-size: 12px;
        color: #64748B;
      }
      html.dark .pa-boot-sub {
        color: #94A3B8;
      }
      @keyframes pa-boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pa-boot-spinner { animation: none; }
      }
    </style>
  </head>
  <body class="bg-[#F4F6FA] text-[#0F172A] dark:bg-[#080C14] dark:text-[#F8FAFC] antialiased selection:bg-[#2563EB]/20 selection:text-[#1D4ED8] dark:selection:bg-[#3B82F6]/25 dark:selection:text-[#93C5FD]">
    <div id="root">
      <div id="pa-boot-loader" role="status" aria-live="polite">
        <div class="pa-boot-spinner" aria-hidden="true"></div>
        <div style="text-align:center">
          <div class="pa-boot-title">Անձնական Օգնական</div>
          <div class="pa-boot-sub" style="margin-top:4px">Բեռնվում է աշխատանքային միջավայրը…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
